<title>发错群了</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: a desktop chat client. Chat list on the left, the open chat in the middle with the composer and reply tray under it,
   the workday status (clock, relationships, embarrassment) on the right. Stacks on phones.
   Sky blue = your bubbles, tomato = embarrassment, everything else quiet office greys. */
:root{
  --bg:#e9ecf1; --panel:#ffffff; --panel-2:#f4f6f9; --fg:#1d2330; --muted:#647086; --line:#d6dbe4;
  --me:#cfe2ff; --me-fg:#16253f; --tomato:#e5484d; --ok:#2f9e6b; --amber:#c98a12; --sel:#3b6fd8;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --panel:#1a1e26; --panel-2:#222733; --fg:#e6e9ef; --muted:#97a1b4; --line:#2e3542;
  --me:#2a4a7c; --me-fg:#e8f0ff; --tomato:#ff6b6f; --ok:#4cc38a; --amber:#e6a93a; --sel:#7aa2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1a1e26; --panel-2:#222733; --fg:#e6e9ef; --muted:#97a1b4; --line:#2e3542;
  --me:#2a4a7c; --me-fg:#e8f0ff; --tomato:#ff6b6f; --ok:#4cc38a; --amber:#e6a93a; --sel:#7aa2ff; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;line-height:1;color:var(--tomato);letter-spacing:.04em}
h1 small{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-left:8px}
.hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.keys{font-size:12.5px;color:var(--muted)}
.keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
.app{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr) minmax(0,250px);gap:12px;align-items:stretch}
@media (max-width:980px){.app{grid-template-columns:minmax(0,210px) minmax(0,1fr)}.side{grid-column:1 / -1}}
@media (max-width:640px){.app{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;display:flex;flex-direction:column}
.list{padding:6px}
.ci{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 8px;border-radius:9px;border:0;background:transparent;text-align:left;width:100%}
.ci:hover{background:var(--panel-2)}
.ci[aria-current="true"]{background:color-mix(in srgb,var(--sel) 14%,transparent)}
.ci.out{opacity:.5}
.ci .av{grid-row:span 2}
.ci .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2}
.ci .badge{grid-row:1;grid-column:3;min-width:18px;height:18px;border-radius:9px;background:var(--tomato);color:#fff;font-size:11px;font-family:var(--mono);display:flex;align-items:center;justify-content:center;padding:0 5px}
.risk{font-size:10.5px;font-weight:400;border-radius:4px;padding:0 4px;margin-left:2px;vertical-align:1px}
.r-low{color:var(--ok);border:1px solid var(--ok)}.r-mid{color:var(--amber);border:1px solid var(--amber)}.r-high{color:var(--tomato);border:1px solid var(--tomato)}
.ci .hk{grid-row:2;grid-column:3;font-family:var(--mono);font-size:11px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;flex:none}
.av.sm{width:32px;height:32px;border-radius:8px;font-size:13px}
.c-work{background:#4a6fa5} .c-family{background:#c2703d} .c-love{background:#d0507a} .c-friends{background:#5c9a5a} .c-classmates{background:#7a5fc4} .c-blind{background:#3f8f9c}
.m-boss{background:#38506f}.m-li{background:#6b7f99}.m-hr{background:#8c6fb0}.m-mom{background:#c2703d}.m-dad{background:#8d6b4f}.m-aunt{background:#b5824c}.m-uncle{background:#9c8a5b}.m-grandma{background:#a55e5e}.m-bao{background:#d0507a}.m-jie{background:#5c9a5a}.m-pang{background:#4f8a7a}.m-mei{background:#8aa04f}.m-monitor{background:#7a5fc4}.m-xueba{background:#5a6bc4}.m-chen{background:#3f8f9c}
.chat{min-height:540px}
.chead{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
.chead .t{font-weight:600;font-size:15px}
.chead .s{font-size:12px;color:var(--muted)}
.msgs{flex:1;min-height:300px;max-height:400px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.m{display:flex;gap:8px;align-items:flex-start;max-width:85%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .who{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px;word-break:break-word;white-space:pre-line}
.m.me .bub{background:var(--me);color:var(--me-fg);border-color:transparent}
.m.me.wrong .bub{box-shadow:0 0 0 2px var(--tomato)}
.meta{font-size:11px;color:var(--muted);margin-top:2px;text-align:right;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.recall{font-size:11.5px;border:1px solid var(--tomato);color:var(--tomato);background:transparent;border-radius:6px;padding:0 6px}
.sys{align-self:center;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent);border-radius:6px;padding:2px 8px;text-align:center}
.ask .bub{border-color:var(--amber)}
.timer{height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--amber)}
.tray{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tray .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tray .lbl b{color:var(--fg)}
.composer{display:flex;gap:8px;align-items:stretch}
.draft{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:8px 10px;font-size:14px;display:flex;align-items:center;word-break:break-word;white-space:pre-line}
.draft.empty{color:var(--muted)}
.draft.locked{color:var(--tomato);border-color:var(--tomato)}
.draft .caret{display:inline-block;width:2px;height:1.1em;background:var(--sel);margin-left:1px;vertical-align:middle}
#sendBtn:disabled{opacity:.45;cursor:default}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:6px}
.card{position:relative;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 28px;font-size:13.5px;min-height:40px;white-space:pre-line}
.card:hover{border-color:var(--sel)}
.card .n{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.emptytray{font-size:13px;color:var(--muted)}
.side{padding:12px 14px;gap:12px}
.clock{font-family:var(--mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.dayline{font-size:12.5px;color:var(--muted)}
.rel{display:grid;grid-template-columns:40px minmax(0,1fr) 30px;gap:6px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;transition:width .25s}
.rel .v{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.shame{display:flex;align-items:baseline;gap:8px}
.shame .n{font-family:var(--display);font-size:44px;color:var(--tomato);line-height:1}
.label{font-size:11.5px;letter-spacing:.12em;color:var(--muted)}
.recalls{font-size:13px}
.recalls b{font-family:var(--mono)}
.status{min-height:20px;font-size:13px;color:var(--muted)}
.modepill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);align-self:flex-start}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.btn.primary{background:var(--tomato);border-color:var(--tomato);color:#fff;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;max-width:min(440px,calc(100vw - 32px));cursor:pointer}
.banner .bt{font-size:12px;color:var(--muted)}
.banner .bm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.alert{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:22;background:var(--tomato);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
.stamp{position:fixed;left:50%;top:40%;z-index:25;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--display);font-size:64px;color:var(--tomato);border:6px solid var(--tomato);border-radius:14px;padding:4px 22px;background:color-mix(in srgb,var(--panel) 70%,transparent);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px)}
/* meeting */
.meeting{position:fixed;inset:0;z-index:24;background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
.mbox h3{margin:0;font-size:18px}
.room{position:relative;height:120px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.camwin{position:absolute;top:0;bottom:0;border:3px solid var(--sel);border-radius:8px;background:color-mix(in srgb,var(--sel) 8%,transparent)}
.camwin.off{border-style:dashed;border-color:var(--muted);background:color-mix(in srgb,var(--fg) 30%,transparent)}
.thing{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:13px;padding:4px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.thing.me{background:var(--me);color:var(--me-fg);border-color:transparent;font-weight:600}
.thing.chaos{border-color:var(--tomato);color:var(--tomato)}
.mbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mbar>i{display:block;height:100%;background:var(--sel)}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:slam .9s ease-out forwards}
  @keyframes slam{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}18%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
  .banner{animation:drop .25s ease-out}
  @keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .draft .caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .alert{animation:pulse .6s ease-in-out infinite alternate}@keyframes pulse{from{opacity:1}to{opacity:.75}}
}
.modal{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:780px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0;color:var(--tomato)}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2);display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--tomato)}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.shot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2);display:flex;flex-direction:column}
.shot .sh{padding:6px 10px;font-size:12px;font-weight:600;border-bottom:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;gap:8px}
.shot .sb{padding:8px;display:flex;flex-direction:column;gap:6px}
.shot .l{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;align-self:flex-start;max-width:92%;white-space:pre-line}
.shot .l.me{align-self:flex-end;background:var(--me);color:var(--me-fg);border-color:transparent;box-shadow:0 0 0 2px var(--tomato)}
.shot .l b{font-weight:600;margin-right:4px}
.shot .after{font-size:11.5px;color:var(--tomato);align-self:center;text-align:center}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--tomato)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.dexi{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel-2);font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.dexi .h{font-size:11.5px;color:var(--muted)}
textarea#recordBox{width:100%;min-height:160px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:12.5px/1.5 var(--mono);padding:10px;box-sizing:border-box}
</style>

<div class="wrap">
  <header>
    <h1>发错群了<small>原型 v0.4</small></h1>
    <div class="hright">
      <div class="keys"><kbd>Q</kbd>–<kbd>Y</kbd> 切换聊天 · <kbd>1</kbd>–<kbd>6</kbd> 选回复 · <kbd>Enter</kbd> 发送 · <kbd>Z</kbd> 撤回</div>
      <button class="btn" id="dexBtn">社死图鉴</button>
    </div>
  </header>
  <div class="app">
    <nav class="pane list" id="list" aria-label="聊天列表"></nav>
    <section class="pane chat">
      <div class="chead"><span class="t" id="ctitle"></span><span class="s" id="csub"></span></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="tray">
        <div class="composer"><div class="draft" id="draft"></div><button class="btn primary" id="sendBtn">发送 ↵</button></div>
        <div class="lbl"><span>点卡片会把字打进输入框，打完按 Enter 发进<b>当前打开</b>的聊天。切换聊天时输入框里的字不会消失。</span><span id="pending"></span></div>
        <div class="cards" id="cards"></div>
      </div>
    </section>
    <aside class="pane side">
      <span class="modepill" id="modePill"></span>
      <div><div class="clock" id="clock">09:00</div><div class="dayline" id="dayline">周一 · 18:00 下班</div></div>
      <div class="shame"><span class="n" id="shame">0</span><span class="label">社死值</span></div>
      <div style="display:flex;flex-direction:column;gap:6px" id="rels"></div>
      <div class="recalls">撤回机会：<b id="recalls">3</b> 次（对方「已读」之前撤回才算数）</div>
      <div class="status" id="status"></div>
      <div class="row"><button class="btn" id="mute">静音</button><button class="btn" id="copyRec">复制试玩记录</button></div>
      <div class="status" id="copyMsg"></div>
    </aside>
  </div>
  <textarea id="recordBox" hidden readonly aria-label="试玩记录"></textarea>
</div>
<div id="bannerHost"></div>
<div id="alertHost"></div>
<div id="stampHost"></div>
<div class="meeting" id="meeting" hidden></div>
<div class="modal" id="modal"></div>

   const alt=LOOKALIKE[to].filter(k=>!isOut(k)&&!(k==="blind"&&S.blindGone));
   if(alt.length&&Math.random()<chance){to=pick(alt);slipped=true;S.slips++;}}
  if(to==="blind"&&S.blindGone){say("小陈已经把你删了，消息被拒收");render();return;}
  const card=S.draft.card;S.draft=null;audio();
  const ask=S.asks.find(a=>a.id===card.ask);
  if(card.cat===to&&ask&&ask.done){
    addMsg(to,{me:true,text:card.text,read:true});log(`… 回晚了（${CHATS[to].name}）：${card.text}`);say("回晚了，对方已经不想理你了。");sfx.send();render();return;
  }
  if(card.cat===to&&ask&&!ask.done){
    ask.done=true;addMsg(to,{me:true,text:card.text,read:true});S.rel[to]=clamp(S.rel[to]+8,0,100);S.stats.right++;sfx.good();
    log(`✓ 回${CHATS[to].name}：${card.text.replace(/\n/g," ")}`);
    if(Math.random()<0.55){const [who,text]=pick(PRAISE[to]);later(rand(0.6,1.4),()=>{addMsg(to,{who,text});render();});}
    say(`回复了${CHATS[to].name}`);
  }else{
    const m=addMsg(to,{me:true,text:card.text,wrong:true});sfx.send();
    S.wrongs.push({msgId:m.id,to,card,sent:S.t,readAt:S.t+rand(1.6,3.0),state:"sent"});S.stats.wrong++;
    log(`✗ ${slipped?"（手滑）":""}把「${card.text.replace(/\n/g," ")}」（本该回${CHATS[card.cat].name}）发进了${CHATS[to].name}`);
    if(slipped){banner(to,"手滑了！","消息发进了「"+CHATS[to].name+"」");sfx.bump();}
    say(slipped?`手滑了！消息发进了「${CHATS[to].name}」！趁还没「已读」，按 Z 撤回！`:S.mode==="chaos"?`发进了${CHATS[to].name}……看看会发生什么`:`糟了……发进了${CHATS[to].name}！趁还没「已读」，按 Z 撤回！`);
  }
  render();
}
function recall(){
  if(!canAct())return;const w=[...S.wrongs].reverse().find(x=>x.state==="sent"||x.state==="read");
  if(!w){say("没有可以撤回的消息");render();return;}
  if(S.recalls<=0){say("今天的撤回机会用完了");render();return;}
  S.recalls--;S.stats.recalled++;sfx.recall();
  const msgs=S.chats[w.to].msgs,i=msgs.findIndex(m=>m.id===w.msgId);
  if(i>=0)msgs[i]={id:msgs[i].id,at:S.t,sys:true,text:"你撤回了一条消息"};
  if(w.state==="sent"){w.state="recalled";log(`↩ 及时撤回（${CHATS[w.to].name}）`);say("撤回成功，没人看到。");}
  else{w.state="recalled-late";S.shame+=1;S.rel[w.to]=clamp(S.rel[w.to]-5,0,100);
    addMsg(w.to,{who:pick(MEMBERS[w.to]),text:pick(["我看到了[狗头]","撤回也没用，我截图了","撤回了什么？？"])});
    log(`↩ 撤回太晚，已被看到（${CHATS[w.to].name}）`);say("撤回晚了，已经有人看到了。");}

}

/* ---------- consequences ---------- */
function reactWrong(w){
  if(w.state!=="read")return;w.state="reacted";
  const sp=SPECIAL[w.card.text]&&SPECIAL[w.card.text][w.to];
  const lines=(sp||REACT[w.card.cat][w.to]||[["li","？"]]).map(([p,t])=>[p,t.replace("{t}",w.card.text)]);
  let danger=w.card.d+(sp?1:0);
  if(w.card.cat==="blind"&&w.to==="love")danger+=1;
  S.shame+=danger;S.rel[w.to]=clamp(S.rel[w.to]-8*danger,0,100);
  const key=codexKey(w.card.text,w.card.cat,w.to),isNew=!DEX[key];
  if(isNew){DEX[key]={text:w.card.text,to:w.to,lines:lines.slice(0,2)};saveDex();S.stats.newDex++;}
  const shot={chat:w.to,text:w.card.text,lines,danger,after:[]};
  S.shots.push(shot);
  lines.forEach(([p,t],i)=>later(0.7*i,()=>{addMsg(w.to,{who:p,text:t});if(i===0)stamp(`社死 +${danger}${isNew?" · 新图鉴":""}`);render();}));
  log(`  社死 +${danger}：${lines.map(([p,t])=>PEOPLE[p].n+"："+t).join(" / ")}${isNew?"（新图鉴）":""}`);
  const after=0.7*lines.length+1.2;
  if(w.to==="work"&&danger>=2)later(after,()=>{
    S.lockUntil=S.t+6;addMsg("work",{sys:true,text:"王总 私聊你：来一下我办公室"});
    alertMsg("你被叫去王总办公室挨训（6 秒内不能打字、不能发消息）",6);shot.after.push("被叫去办公室挨训");log("  被叫去王总办公室挨训 6 秒");render();});
  if(GROUPS.includes(w.to)&&danger>=4)later(after+0.5,()=>{
    const [kicker,inviter]=KICK[w.to];S.kicked[w.to]=S.t+25;
    addMsg(w.to,{sys:true,text:`${PEOPLE[kicker].n} 将你移出了群聊`});
    later(25,()=>{addMsg(w.to,{sys:true,text:`${PEOPLE[inviter].n} 邀请你重新加入了群聊`});log(`  被拉回${CHATS[w.to].name}`);render();});
    shot.after.push(`被${PEOPLE[kicker].n}移出群聊`);log(`  被移出${CHATS[w.to].name} 25 秒`);if(S.draft&&S.open===w.to)say("你被移出了群聊！");render();});
  if(danger>=3&&Math.random()<0.6)later(after+1.5,()=>{
    const dest=pick(GROUPS.filter(g=>g!==w.to&&!isOut(g)));if(!dest)return;
    const [who,text]=LEAK[dest];addMsg(dest,{who,text:`${text}\n「${w.card.text}」`});
    const [p2,t2]=pick(LEAK_REACT[dest]);later(0.8,()=>{addMsg(dest,{who:p2,text:t2});render();});
    S.shame+=1;S.rel[dest]=clamp(S.rel[dest]-4,0,100);shot.after.push(`截图流传到「${CHATS[dest].name}」`);
    if(dest!==S.open)banner(dest,PEOPLE[who].n,"[截图] ……");stamp("截图流传 +1");log(`  截图流传到${CHATS[dest].name}（社死 +1）`);render();});
}

  later(1.5,()=>{addMsg("family",{who:"mom",text:"小陈说你们不合适？？你到底跟人家说了什么！"});S.rel.family=clamp(S.rel.family-20,0,100);

/* ---------- events ---------- */
function startMeeting(){
  S.meeting={start:S.t,dur:16,cam:50,camOn:true,offTime:0,offWarned:false,items:[],faceGone:0,faceHit:false};
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const picks=[...MEET_ITEMS].sort(()=>Math.random()-0.5).slice(0,3);
  picks.forEach((it,i)=>{const fromLeft=Math.random()<0.5;S.meeting.items.push({...it,x:fromLeft?-8:108,v:(fromLeft?1:-1)*rand(10,15),appear:1.5+i*4.5,on:false,expo:0,hit:false});});
  addMsg("work",{sys:true,text:"王总 发起了视频会议"});log("📹 视频会议开始");sfx.alarm();render();
}
function tickMeeting(dt){
  const M=S.meeting,el=S.t-M.start;
  if(!M.camOn){M.offTime+=dt;if(M.offTime>2.5&&!M.offWarned){M.offWarned=true;S.rel.work=clamp(S.rel.work-4,0,100);addMsg("work",{who:"boss",text:"你摄像头怎么关了？"});log("  📹 摄像头关太久");}}
  const win=[M.cam-20,M.cam+20];
  M.items.forEach(it=>{if(el>=it.appear){it.on=true;it.x+=it.v*dt;}
    if(it.on&&!it.hit&&M.camOn&&it.x>win[0]&&it.x<win[1]){it.expo+=dt;if(it.expo>0.5){it.hit=true;
      S.shame+=2;S.rel.work=clamp(S.rel.work-8,0,100);it.lines.forEach(([p,t],i)=>later(0.6*i,()=>{addMsg("work",{who:p,text:t});render();}));
      S.shots.push({chat:"work",text:`[视频会议] 镜头里出现了${it.n}`,lines:it.lines,danger:2,after:[]});stamp(`${it.n}入镜了 +2`);log(`  📹 ${it.n}入镜（社死 +2）`);}}});
  const faceIn=M.camOn&&50>win[0]&&50<win[1];
  if(M.camOn&&!faceIn){M.faceGone+=dt;if(M.faceGone>1.2&&!M.faceHit){M.faceHit=true;S.rel.work=clamp(S.rel.work-6,0,100);addMsg("work",{who:"boss",text:"你人呢？镜头对着哪呢"});log("  📹 脸不在镜头里");}}
  else M.faceGone=0;
  if(el>=M.dur){const hits=M.items.filter(i=>i.hit).length;
    addMsg("work",{who:"boss",text:hits?"今天会就开到这……":"好，今天会就开到这，大家辛苦"});
    if(!hits){S.rel.work=clamp(S.rel.work+6,0,100);}
    log(`📹 视频会议结束（入镜 ${hits} 次）`);S.meeting=null;}
}

/* ---------- tick ---------- */
function tick(now){
  const dt=Math.min(0.25,(now-last)/1000);last=now;
  if(S.phase==="play"&&!S.paused){
    S.t+=dt;
    if(!S.ev.meeting&&S.t>=atClock(10,30)){S.ev.meeting=true;startMeeting();}
    if(!S.ev.patrol1&&S.t>=atClock(12,40)){S.ev.patrol1=true;startPatrol();}
    if(!S.ev.dance&&S.t>=atClock(14,20)){S.ev.dance=true;startDance();}
    if(!S.ev.patrol2&&S.t>=atClock(16,10)){S.ev.patrol2=true;startPatrol();}
    if(!S.ev.subway&&S.t>=atClock(17,20)){S.ev.subway=true;startSubway();}
    if(S.meeting){S.asks.forEach(a=>{if(!a.done)a.deadline+=dt;});tickMeeting(dt);}
    if(S.patrol&&S.t>=S.patrol.until)resolvePatrol();
    if(S.subway&&!S.meeting&&S.t>=S.nextBump){bump();S.nextBump=S.t+rand(4,6.5);}
    if(S.t>=S.nextAsk){spawnAsk();S.nextAsk=S.t+clamp(5.5-S.t/DAY*3.4,2.2,5.5)*rand(0.7,1.3);}
    if(S.t>=S.nextChatter){spawnChatter();S.nextChatter=S.t+rand(3,6);}
    for(let i=timers.length-1;i>=0;i--)if(S.t>=timers[i].at){const f=timers[i].fn;timers.splice(i,1);f();}
    S.asks.forEach(a=>{if(!a.done&&S.t>=a.deadline){a.done=true;a.expired=true;S.rel[a.chat]=clamp(S.rel[a.chat]-10,0,100);S.stats.expired++;
      const ci=S.cards.findIndex(c=>c.ask===a.id);if(ci>=0)S.cards.splice(ci,1);
      const [who,text]=pick(TIMEOUT[a.chat]);addMsg(a.chat,{who,text});sfx.timeout();log(`⌛ 没回${CHATS[a.chat].name}：${a.src.q.replace(/\n/g," ")}`);}});
    S.wrongs.forEach(w=>{if(w.state==="sent"&&S.t>=w.readAt){w.state="read";
      const m=S.chats[w.to].msgs.find(x=>x.id===w.msgId);if(m)m.read=true;sfx.read();later(0.9,()=>reactWrong(w));}});
    if(!S.blindGone&&S.rel.blind<=0)blindGoneEvent();
    if(S.mode==="normal"){const broken=ORDER.find(k=>k!=="blind"&&S.rel[k]<=0);if(broken)endDay(broken);}
    if(S.phase==="play"&&S.t>=DAY)endDay(null);
    render(true);
  }
  requestAnimationFrame(tick);
}
function endDay(broken){S.phase="end";S.ending=broken;S.meeting=null;S.patrol=null;$("#alertHost").innerHTML="";log(broken?`结束：${ENDING[broken]}`:"下班了！");render();}

function renderMeeting(){

  $("#mThings").innerHTML=M.items.filter(i=>i.on&&i.x>-10&&i.x<110).map(i=>`<div class="thing chaos" style="left:${i.x}%">${esc(i.n)}</div>`).join("");
  $("#mOff").textContent=M.camOn?"关摄像头（空格）":"开摄像头（空格）";
  $("#mBar").style.width=(100*(S.t-M.start)/M.dur)+"%";
}
function title(){const s=S.shame;return s===0?"零社死，人间清醒":s<=3?"轻度社死":s<=8?"社死达人":s<=14?"社死专业户":"社死传说";}
function renderModal(){
  const m=$("#modal"),key=S.phase+(S.phase==="end"?S.shots.length:"")+(S.dexOpen?"dex"+Object.keys(DEX).length:"");
  if(key===modalKey)return;modalKey=key;
  if(S.dexOpen){
    const list=Object.values(DEX);const n=list.length;
    m.innerHTML=`<div class="sheet" role="dialog" aria-label="社死图鉴"><h2>社死图鉴</h2>
      <div>已发现 <b>${n}</b> / ${CODEX_TOTAL} 种反应。同一句话发进不同的群，反应不一样；有些组合有专门写的反应。</div>
      <div class="prog"><i style="width:${100*n/CODEX_TOTAL}%"></i></div>
      <div class="dex">${n?list.map(e=>`<div class="dexi"><span class="h">发进「${esc(CHATS[e.to].name)}」</span><b>${esc(e.text)}</b>${e.lines.map(([p,t])=>`<span>${esc(PEOPLE[p].n)}：${esc(t)}</span>`).join("")}</div>`).join(""):"<div>还没有发现任何反应。试试故意社死模式。</div>"}</div>
      <div class="row"><button class="btn primary" id="dexClose">关闭</button></div></div>`;
    m.hidden=false;return;
  }
  if(S.phase==="intro"){
    m.innerHTML=`<div class="sheet" role="dialog" aria-label="开始"><h2>发错群了</h2>
      <div>周一早上 9:00。工作群、家族群、对象、死党、老同学和妈介绍的相亲对象，会同时找你。撑到 18:00 下班。</div>
      <ul>
        <li>点左边的聊天（或按 <b>Q W E R T Y</b>）切换。点回复卡片（或按 <b>1–6</b>），字会打进输入框；打完按 <b>Enter</b> 发进<b>当前打开</b>的聊天。</li>
        <li>切换聊天时输入框里的字不会消失。卡片上不写是回谁的。</li>
        <li>每个聊天的<b>手滑风险</b>不一样：给宝发消息你会格外小心（低）；人多又容易混的群（同学群、死党群、家族群）容易手滑，发进长得像的聊天里（高）。刚切过去就急着发、或者待回消息太多时，风险更高。</li>
        <li>发错了？在对方「已读」之前按 <b>Z</b> 撤回，一天 3 次。发错进工作群会被叫去挨训；太离谱会被移出群聊；截图还会流传到别的群。</li>
        <li>今天还有：10:30 视频会议、老板巡视（两次）、家族群广场舞接龙、17:20 下班挤地铁。</li>
      </ul>
      <div class="modes">
        <button class="mode" data-mode="normal"><b>正常上班</b><span>关系掉到 0 当天就结束（小陈除外）。尽量别发错。</span></button>
        <button class="mode" data-mode="chaos"><b>故意社死</b><span>不会被开除，也不会被分手。专门把话发错群，收集社死图鉴。</span></button>
      </div></div>`;
    m.hidden=false;return;
  }
  if(S.phase==="end"){
    const top=[...S.shots].sort((a,b)=>b.danger-a.danger);
    const shots=top.length?top.map(s=>`<div class="shot"><div class="sh"><span>${esc(CHATS[s.chat].name)}</span><span style="color:var(--tomato)">社死 +${s.danger}</span></div><div class="sb">
      <div class="l me">${esc(s.text)}</div>${s.lines.map(([p,t])=>`<div class="l"><b>${esc(PEOPLE[p].n)}</b>${esc(t)}</div>`).join("")}${s.after.map(a=>`<div class="after">${esc(a)}</div>`).join("")}</div></div>`).join("")
      :`<div>今天一条都没发错。</div>`;
    m.innerHTML=`<div class="sheet" role="dialog" aria-label="下班结算"><h2>${S.ending?"今天提前结束了":title()}</h2>
      ${S.ending?`<div><b>${esc(ENDING[S.ending])}</b></div>`:`<div>18:00，下班了。${S.mode==="chaos"?"（故意社死模式）":""}</div>`}
      <div>社死值 <b>${S.shame}</b> · 回对 ${S.stats.right} 条 · 发错 ${S.stats.wrong} 条（手滑 ${S.slips}）· 没回 ${S.stats.expired} 条 · 撤回 ${S.stats.recalled} 次 · 新图鉴 ${S.stats.newDex} 个（共 ${Object.keys(DEX).length}/${CODEX_TOTAL}）${S.blindGone?" · 被小陈删了":""}</div>
      <div class="label">今日社死精选</div>
      <div class="shots">${shots}</div>
      <div class="row"><button class="btn primary" id="again">再过一天</button><button class="btn" id="openDex">社死图鉴</button><button class="btn" id="copy2">复制试玩记录</button><span class="status" id="copyMsg2"></span></div></div>`;
    m.hidden=false;return;
  }
  m.hidden=true;m.innerHTML="";
}

/* ---------- record ---------- */
function recordText(){
  return ["发错群了 原型 v0.4 试玩记录",`模式：${S.mode==="chaos"?"故意社死":"正常上班"}`,...S.record,"—— 汇总 ——",
    `社死值 ${S.shame}；回对 ${S.stats.right}，发错 ${S.stats.wrong}（其中手滑 ${S.slips}），没回 ${S.stats.expired}，撤回 ${S.stats.recalled}，新图鉴 ${S.stats.newDex}（累计 ${Object.keys(DEX).length}/${CODEX_TOTAL}）`,
    `关系：${ORDER.map(k=>CHATS[k].rel+" "+(k==="blind"&&S.blindGone?"已删":Math.round(S.rel[k]))).join("，")}`,
    S.ending?`提前结束：${ENDING[S.ending]}`:(S.phase==="end"?"撑到了下班":"（还没结束）")].join("\n");
}
function copyRecord(sel){
  const txt=recordText(),box=$("#recordBox");
  const fb=()=>{box.value=txt;box.hidden=false;box.focus();box.select();$(sel).textContent="已展开记录，请手动复制";};
  try{navigator.clipboard.writeText(txt).then(()=>{$(sel).textContent="已复制";},fb);}catch(e){fb();}
}

/* ---------- events ---------- */
function begin(mode){audio();newDay(mode);S.phase="play";modalKey="";lastMsgKey=lastListKey=lastCardsKey="";render();}
function setDex(open){S.dexOpen=open;if(S.phase==="play")S.paused=open;modalKey="";render();}
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-chat]");if(b)openChat(b.dataset.chat);});
$("#cards").addEventListener("click",e=>{const b=e.target.closest("[data-card]");if(b)pickCard(+b.dataset.card);});
$("#sendBtn").addEventListener("click",()=>sendDraft());
$("#msgs").addEventListener("click",e=>{if(e.target.closest("[data-recall]"))recall();});
$("#bannerHost").addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b){openChat(b.dataset.open);$("#bannerHost").innerHTML="";}});
$("#meeting").addEventListener("click",e=>{const b=e.target.closest("[data-cam]");if(!b)return;const v=b.dataset.cam;if(v==="off")camToggle();else camMove(+v*8);if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();render();});
$("#mute").addEventListener("click",()=>{muted=!muted;$("#mute").textContent=muted?"已静音":"静音";});
$("#copyRec").addEventListener("click",()=>copyRecord("#copyMsg"));
$("#dexBtn").addEventListener("click",()=>setDex(true));
$("#modal").addEventListener("click",e=>{
  const md=e.target.closest("[data-mode]");if(md){begin(md.dataset.mode);return;}
  if(e.target.closest("#dexClose")){setDex(false);return;}
  if(e.target.closest("#openDex")){setDex(true);return;}
  if(e.target.closest("#again")){const mode=S.mode;newDay(mode);modalKey="";render();return;}
  if(e.target.closest("#copy2"))copyRecord("#copyMsg2");
});
document.addEventListener("keydown",e=>{
  if(!S||e.target.closest("textarea"))return;
  const k=e.key.toLowerCase();
  if(S.dexOpen){if(k==="escape")setDex(false);return;}
  if(S.phase!=="play")return;
  if(S.meeting){
    if(k==="arrowleft"){e.preventDefault();camMove(-4);}
    else if(k==="arrowright"){e.preventDefault();camMove(4);}
    else if(k===" "||e.code==="Space"){e.preventDefault();if(!e.repeat)camToggle();}
    return;
  }
  const ci={q:"work",w:"family",e:"love",r:"friends",t:"classmates",y:"blind"}[k];
  if(ci){openChat(ci);return;}
  if(/^[1-9]$/.test(k)){pickCard(+k-1);return;}
  if(k==="enter"){e.preventDefault();sendDraft();return;}
  if(k==="z")recall();
});

document.addEventListener("keyup",e=>{if(S&&S.meeting&&(e.key===" "||e.code==="Space"))e.preventDefault();});
loadDex();newDay("normal");render();
last=performance.now();requestAnimationFrame(tick);
})();
</script>

name: Deploy free demo preview

on:
  push:
    branches: [codex/free-demo-preview]
    paths:
      - 'frontend/**'
      - '.github/workflows/demo-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run demo:build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /smartDepanneur
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
